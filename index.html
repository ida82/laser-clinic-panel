<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت هوشمند کلینیک زیبایی</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Persian Datepicker & Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"/>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Font Vazirmatn -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

  <style>
    body { 
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif; 
      background: #080c14;
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(236, 72, 153, 0.08) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glass-surface {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
    }

    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    
    .service-chip input[type="checkbox"] { display: none; }
    .service-chip input[type="checkbox"]:checked + label {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
      transform: translateY(-1px);
    }

    .status-pending-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.14) 0%, rgba(180, 83, 9, 0.05) 100%) !important;
      border: 1px solid rgba(245, 158, 11, 0.4) !important;
    }
    .status-completed-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.16) 0%, rgba(5, 150, 105, 0.06) 100%) !important;
      border: 1px solid rgba(16, 185, 129, 0.45) !important;
    }
    .status-cancelled-card {
      background: rgba(239, 68, 68, 0.06) !important;
      border: 1px solid rgba(239, 68, 68, 0.25) !important;
      opacity: 0.6;
    }
  </style>
</head>
<body class="p-3 md:p-8 antialiased relative">
  
  <div class="ambient-glow"></div>

      </div>

      <div class="flex items-center gap-3">

    <!-- کارت‌های آمار -->

      </div>
    </div>

    <!-- تقویم هفتگی -->
    <div class="glass-surface rounded-3xl p-5 md:p-7 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-4 pb-3 border-b border-white/5">
        <div class="flex items-center gap-2">

  <!-- پنجره مودال ثبت نوبت -->

      <div class="flex items-center justify-between pb-3 border-b border-white/10">

          <i data-lucide="user-plus" class="w-4 h-4 text-purple-400"></i>

      <form id="appointmentForm" class="space-y-3.5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">نام و نام خانوادگی مراجع <span class="text-rose-400">*</span></label>

          </div>
        </div>

        <div>

            <div class="service-chip"><input type="checkbox" id="srv_lip" value="پشت لب"><label for="srv_lip" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">پشت لب</label></div>

            <div class="service-chip"><input type="checkbox" id="srv_forearm" value="ساعد"><label for="srv_forearm" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">ساعد</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_stomach" value="شکم"><label for="srv_stomach" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">شکم</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_navel" value="خط ناف"><label for="srv_navel" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">خط ناف</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_bikini" value="بیکینی"><label for="srv_bikini" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">بیکینی</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_buttline" value="خط باسن"><label for="srv_buttline" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">خط باسن</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_butt" value="باسن"><label for="srv_butt" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">باسن</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_back" value="کمر"><label for="srv_back" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">کمر</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_thigh" value="ران"><label for="srv_thigh" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">ران</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_fullleg" value="کل پا"><label for="srv_fullleg" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">کل پا</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_shin" value="ساق"><label for="srv_shin" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">ساق</label></div>
            <div class="service-chip"><input type="checkbox" id="srv_co2" value="CO2"><label for="srv_co2" class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-xl text-[11px] cursor-pointer inline-block text-slate-300 font-medium">CO2</label></div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">تاریخ نوبت <span class="text-rose-400">*</span></label>
            <input type="text" id="appointmentDate" placeholder="۱۴۰۵/۰۶/۰۸" autocomplete="off" readonly
              class="w-full px-3 py-2 rounded-2xl bg-white/5 border border-white/10 text-xs text-white cursor-pointer font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">ساعت شروع <span class="text-rose-400">*</span></label>
            <div dir="ltr" class="flex items-center justify-between bg-white/5 border border-white/10 rounded-2xl px-3 py-2">
              <input type="number" id="inputHour" min="0" max="23" placeholder="00" class="w-10 text-center text-xs font-black text-white bg-transparent outline-none">
              <span class="text-white/30 font-bold">:</span>
              <input type="number" id="inputMin" min="0" max="59" placeholder="00" class="w-10 text-center text-xs font-black text-white bg-transparent outline-none">

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">مدت زمان</label>

              <option value="20">۲۰ دقیقه</option>
              <option value="30">۳۰ دقیقه</option>
              <option value="45">۴۵ دقیقه</option>
              <option value="60" selected>۱ ساعت</option>
              <option value="90">۱.۵ ساعت</option>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">مبلغ خدمت (تومان)</label>
            <input type="number" id="servicePrice" placeholder="مثلاً: 650000"

            ثبت و ذخیره قطعی
          </button>

  <script>
    const SUPABASE_URL = 'https://rtCxtskzyeiwiprbgfwn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Ox7zpdNlA2Endq7QeiyrSw_kTs67BMB';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let appointments = [];
    let clients = {};
    let currentWeekOffset = 0;

    function toEnDigits(str) {
      if (!str) return '';
      return str.toString()
        .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    function openModal(defaultDate = null) {
      if (defaultDate) {
        $('#appointmentDate').val(defaultDate);
      }
      $('#appointmentModal').removeClass('hidden').addClass('flex');
    }

    function closeModal() {
      $('#appointmentModal').addClass('hidden').removeClass('flex');
    }

    $(document).ready(function() {
      lucide.createIcons();

      $("#appointmentDate").pDatepicker({
        format: 'YYYY/MM/DD',
        autoClose: true,
        initialValue: true,
        initialValueType: 'persian'
      });

      $("#jumpDatePicker").pDatepicker({
        format: 'YYYY/MM/DD',
        autoClose: true,
        initialValue: false,
        onSelect: function(unix) {
          const selected = new persianDate(unix);
          const today = new persianDate();
          const todaySat = new persianDate().subtract('days', today.day() - 1);
          const selSat = new persianDate(unix).subtract('days', selected.day() - 1);
          const diffTime = selSat.valueOf() - todaySat.valueOf();
          currentWeekOffset = Math.round(diffTime / (1000 * 60 * 60 * 24 * 7));
          renderWeekCalendar();
        }
      });

      const now = new Date();
      $('#inputHour').val(now.getHours() < 10 ? '0' + now.getHours() : now.getHours());
      $('#inputMin').val('00');

      initLiveDateTime();
      setupEventListeners();
      fetchFromDatabase();
    });

    async function fetchFromDatabase() {
      $('#syncStatus').text('در حال دریافت داده‌ها...');
      try {
        const { data, error } = await supabaseClient
          .from('appointments')
          .select('*')
          .order('time', { ascending: true });

        if (error) throw error;

        appointments = (data || []).map(row => ({
          id: row.id,
          clientName: row.client_name,
          phone: row.phone,
          service: row.service,
          date: row.date,
          time: row.time,
          duration: row.duration,
          price: row.price,
          status: row.status,
          notes: row.notes
        }));

        clients = {};
        appointments.forEach(a => {
          if (a.phone && a.clientName) clients[a.phone.trim()] = a.clientName.trim();
        });

        updateStatistics();
        setupAutocomplete();
        renderWeekCalendar();
        $('#syncStatus').text('پایگاه داده آنلاین و آماده');
      } catch (err) {
        $('#syncStatus').text('خطا در ارتباط با سرور');
      }
    }

    function updateStatistics() {
      $('#statTotalApps').text(appointments.length);
      const pending = appointments.filter(a => a.status === 'pending').length;
      const completed = appointments.filter(a => a.status === 'completed').length;
      let income = 0;
      appointments.filter(a => a.status === 'completed').forEach(a => { income += (a.price || 0); });

      $('#statPendingApps').text(pending);
      $('#statCompletedApps').text(completed);
      $('#statTotalIncome').text(income.toLocaleString() + ' تومان');
    }

    function initLiveDateTime() {
      function tick() {
        const pDate = new persianDate();
        $('#liveDate').text(pDate.format('dddd DD MMMM YYYY'));
        $('#liveClock').text(pDate.format('HH:mm:ss'));
      }
      tick();
      setInterval(tick, 1000);
    }

    function setupEventListeners() {
      $('#appointmentForm').on('submit', handleFormSubmit);
      $('#prevWeekBtn').on('click', () => { currentWeekOffset--; renderWeekCalendar(); });
      $('#nextWeekBtn').on('click', () => { currentWeekOffset++; renderWeekCalendar(); });
      $('#todayBtn').on('click', () => { currentWeekOffset = 0; renderWeekCalendar(); });

      $('#inputHour').on('input', function() {
        let val = $(this).val();
        if (val.length >= 2 || parseInt(val) > 2) {
          $('#inputMin').focus().select();
        }
      });

      $('#clientFullName').on('input change', function() {
        const name = $(this).val().trim();
        const foundPhone = Object.keys(clients).find(phone => clients[phone] === name);
        if (foundPhone) $('#clientPhone').val(foundPhone);
      });

      $('#clientPhone').on('input change', function() {
        const phone = $(this).val().trim();
        if (clients[phone]) $('#clientFullName').val(clients[phone]);
      });

      $('#appointmentModal').on('click', function(e) {
        if (e.target === this) closeModal();
      });

      $(document).on('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
      });
    }

    function setupAutocomplete() {
      const phoneList = $('#phoneSuggestions');
      const nameList = $('#nameSuggestions');
      phoneList.empty();
      nameList.empty();

      Object.keys(clients).forEach(phone => {
        phoneList.append(`<option value="${phone}">${clients[phone]}</option>`);
        nameList.append(`<option value="${clients[phone]}">${phone}</option>`);
      });
    }

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function checkConflict(dateStr, startTime, duration) {
      const newStart = timeToMinutes(startTime);
      const newEnd = newStart + parseInt(duration);

      return appointments.some(app => {
        if (app.status === 'cancelled') return false;
        if (toEnDigits(app.date) !== toEnDigits(dateStr)) return false;

        const existStart = timeToMinutes(app.time);
        const existEnd = existStart + parseInt(app.duration);

        return Math.max(newStart, existStart) < Math.min(newEnd, existEnd);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const phone = $('#clientPhone').val().trim();
      const fullName = $('#clientFullName').val().trim();
      
      const selectedServices = [];
      $('.service-chip input[type="checkbox"]:checked').each(function() {
        selectedServices.push($(this).val());
      });
      const service = selectedServices.join('، ');

      const rawDate = $('#appointmentDate').val();
      const date = toEnDigits(rawDate);
      const hourVal = $('#inputHour').val().trim();
      const minVal = $('#inputMin').val().trim();
      const duration = parseInt($('#duration').val());
      const price = parseInt($('#servicePrice').val()) || 0;
      const notes = $('#appointmentNotes').val().trim();

      if (!fullName || !phone || selectedServices.length === 0 || !date || hourVal === '' || minVal === '') {
        $('#validationMessage').text('لطفاً تمامی فیلدهای الزامی و حداقل یک ناحیه خدمت را انتخاب کنید.');
        $('#validationAlert').removeClass('hidden');
        return;
      }

      const h = parseInt(hourVal);
      const m = parseInt(minVal);
      const time = `${h < 10 ? '0' + h : h}:${m < 10 ? '0' + m : m}`;

      if (checkConflict(date, time, duration)) {
        $('#validationMessage').text(`تداخل زمانی! در تاریخ ${date} از ساعت ${time} این نوبت پر است.`);
        $('#validationAlert').removeClass('hidden');
        return;
      }
      $('#validationAlert').addClass('hidden');

      const newAppointment = {
        id: 'app_' + Date.now(),
        client_name: fullName,
        phone: phone,
        service: service,
        date: date,
        time: time,
        duration: duration,
        price: price,
        status: 'pending',
        notes: notes
      };

      $('#syncStatus').text('در حال ذخیره...');
      
      const { error } = await supabaseClient
        .from('appointments')
        .insert([newAppointment]);

      if (error) {
        alert('خطا در ذخیره: ' + error.message);
        return;
      }

      $('#appointmentForm')[0].reset();
      $('.service-chip input[type="checkbox"]').prop('checked', false);
      closeModal();
      fetchFromDatabase();
    }

    window.changeStatus = async function(id, newStatus) {
      const { error } = await supabaseClient
        .from('appointments')
        .update({ status: newStatus })
        .eq('id', id);

      if (!error) {
        fetchFromDatabase();
      }
    };

    window.deleteAppointment = async function(id) {
      if (confirm('آیا از حذف این نوبت اطمینان دارید؟')) {
        const { error } = await supabaseClient
          .from('appointments')
          .delete()
          .eq('id', id);

        if (!error) {
          fetchFromDatabase();
        }
      }
    };

    window.toggleDetails = function(id) {
      $(`#details_${id}`).slideToggle(180);
    };

    window.exportToStyledExcel = function() {
      if (appointments.length === 0) {
        alert('هیچ نوبتی ثبت نشده است.');
        return;
      }

      const wb = XLSX.utils.book_new();

      const clientData = [["ردیف", "نام و نام خانوادگی", "شماره تماس"]];
      let cIndex = 1;
      Object.keys(clients).forEach(phone => {
        clientData.push([cIndex++, clients[phone], phone]);
      });
      const wsClients = XLSX.utils.aoa_to_sheet(clientData);
      wsClients['!cols'] = [{ wch: 8 }, { wch: 25 }, { wch: 18 }];
      XLSX.utils.book_append_sheet(wb, wsClients, "مشتریان");

      const allAppointmentsData = [
        ["ردیف", "نام مراجع", "شماره تماس", "نوع خدمت", "تاریخ", "ساعت", "مدت (دقیقه)", "مبلغ (تومان)", "وضعیت", "توضیحات"]
      ];
      appointments.forEach((a, idx) => {
        let statusLabel = a.status === 'completed' ? 'انجام شد' : a.status === 'cancelled' ? 'لغو شده' : 'در انتظار';
        allAppointmentsData.push([
          idx + 1, a.clientName, a.phone, a.service, a.date, a.time, a.duration, a.price || 0, statusLabel, a.notes || ''
        ]);
      });
      const wsAppointments = XLSX.utils.aoa_to_sheet(allAppointmentsData);
      wsAppointments['!cols'] = [{ wch: 6 }, { wch: 22 }, { wch: 16 }, { wch: 26 }, { wch: 14 }, { wch: 10 }, { wch: 12 }, { wch: 16 }, { wch: 14 }, { wch: 30 }];
      XLSX.utils.book_append_sheet(wb, wsAppointments, "همه نوبت‌ها");

      const accountingData = [
        ["ردیف", "نام مراجع", "شماره تماس", "خدمت انجام‌شده", "تاریخ نوبت", "ساعت", "مبلغ دریافتی (تومان)"]
      ];
      let totalRevenue = 0;
      let accIndex = 1;
      appointments.filter(a => a.status === 'completed').forEach(a => {
        const val = a.price || 0;
        totalRevenue += val;
        accountingData.push([accIndex++, a.clientName, a.phone, a.service, a.date, a.time, val]);
      });
      accountingData.push(["", "", "", "", "", "جمع کل دریافتی:", totalRevenue]);

      const wsAccounting = XLSX.utils.aoa_to_sheet(accountingData);
      wsAccounting['!cols'] = [{ wch: 6 }, { wch: 22 }, { wch: 16 }, { wch: 28 }, { wch: 14 }, { wch: 10 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, wsAccounting, "داشبورد حسابداری");

      XLSX.writeFile(wb, `گزارش_کلینیک_${new persianDate().format('YYYY-MM-DD')}.xlsx`);
    };

    function renderWeekCalendar() {
      const container = $('#weekCalendarContainer');
      container.empty();

      let baseDate = new persianDate().add('days', currentWeekOffset * 7);
      let dayOfWeek = baseDate.day();
      let startOfWeek = baseDate.subtract('days', dayOfWeek - 1);

      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        weekDays.push(new persianDate(startOfWeek.valueOf()).add('days', i));
      }

      $('#weekRangeDisplay').text(`${weekDays[0].format('DD MMMM')} الی ${weekDays[6].format('DD MMMM YYYY')}`);
      const todayStr = toEnDigits(new persianDate().format('YYYY/MM/DD'));

      weekDays.forEach(day => {
        const formattedDate = toEnDigits(day.format('YYYY/MM/DD'));
        const isToday = formattedDate === todayStr;

        const dayAppointments = appointments
          .filter(a => toEnDigits(a.date) === formattedDate)
          .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

        const hasAppointments = dayAppointments.length > 0;

        let cardsHtml = '';
        dayAppointments.forEach(app => {
          let cardClass = 'status-pending-card';
          let badgeText = 'در انتظار حضور';
          let badgeColor = 'text-amber-300 bg-amber-400/20';

          if (app.status === 'completed') {
            cardClass = 'status-completed-card';
            badgeText = 'انجام شد';
            badgeColor = 'text-emerald-300 bg-emerald-400/20';
          } else if (app.status === 'cancelled') {
            cardClass = 'status-cancelled-card';
            badgeText = 'لغو شد';
            badgeColor = 'text-rose-300 bg-rose-400/20';
          }

          cardsHtml += `
            <div class="${cardClass} rounded-2xl p-3.5 transition-all text-xs">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-3">
                  <span class="font-mono text-xs font-black bg-black/40 text-white px-3 py-1 rounded-xl border border-white/10">${app.time}</span>
                  <span class="font-black text-sm text-white">${app.clientName}</span>
                  <span class="text-xs font-mono text-slate-400">${app.phone}</span>
                  <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full ${badgeColor}">${badgeText}</span>
                  
                  <button onclick="toggleDetails('${app.id}')" class="px-2.5 py-1 bg-white/10 hover:bg-white/20 text-indigo-300 rounded-xl text-xs font-bold transition flex items-center gap-1">
                    <i data-lucide="info" class="w-3.5 h-3.5"></i> جزئیات
                  </button>
                </div>

                <div class="flex items-center gap-1.5">
                  <button onclick="changeStatus('${app.id}', 'pending')" class="px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold transition">⏳ انتظار</button>
                  <button onclick="changeStatus('${app.id}', 'completed')" class="px-2.5 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 rounded-xl text-xs font-bold transition">✔️ انجام</button>
                  <button onclick="changeStatus('${app.id}', 'cancelled')" class="px-2.5 py-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 rounded-xl text-xs font-bold transition">✖️ لغو</button>
                  <button onclick="deleteAppointment('${app.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <div id="details_${app.id}" class="hidden mt-3 pt-3 border-t border-white/10 text-xs text-slate-300 space-y-1.5">
                <div class="flex flex-wrap gap-4">
                  <div><span class="text-slate-400">ناحیه خدمت:</span> <span class="text-indigo-300 font-bold">${app.service}</span></div>
                  <div><span class="text-slate-400">مدت زمان:</span> <span class="text-white font-bold">${app.duration} دقیقه</span></div>
                  <div><span class="text-slate-400">مبلغ:</span> <span class="text-emerald-400 font-black font-mono">${app.price ? Number(app.price).toLocaleString() + ' تومان' : 'ثبت نشده'}</span></div>
                </div>
                ${app.notes ? `<div class="bg-black/30 p-2 rounded-xl border border-white/5 text-slate-300 mt-1">نکات پرونده: ${app.notes}</div>` : ''}
              </div>
            </div>
          `;
        });

        let rowHtml = '';
        if (hasAppointments) {
          rowHtml = `
            <div class="glass-surface p-3.5 rounded-3xl flex flex-col md:flex-row items-stretch gap-3.5 ${isToday ? 'ring-2 ring-indigo-500/60 bg-indigo-950/20' : ''}">
              <div class="flex md:flex-col items-center justify-between md:justify-center p-3 rounded-2xl ${isToday ? 'bg-gradient-to-tr from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/30' : 'bg-white/5 text-slate-300'} md:w-32 shrink-0 text-center">
                <span class="font-black text-xs">${day.format('dddd')}</span>
                <span class="text-[11px] opacity-80 mt-0.5">${day.format('DD MMMM')}</span>
                
                <span class="text-[10px] mt-2 px-2.5 py-0.5 rounded-full font-black ${isToday ? 'bg-white/20 text-white' : 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'}">
                  ${dayAppointments.length} نوبت
                </span>
              </div>

              <div class="flex-1 flex flex-col gap-2 justify-center">
                ${cardsHtml}
              </div>
            </div>
          `;
        } else {
          rowHtml = `
            <div class="glass-pill p-2 px-3.5 rounded-2xl flex items-center justify-between gap-3 opacity-65 hover:opacity-100 transition-all ${isToday ? 'ring-1 ring-indigo-500/40 opacity-90' : ''}">
              <div class="flex items-center gap-3">
                <span class="w-1.5 h-1.5 rounded-full ${isToday ? 'bg-indigo-400 animate-ping' : 'bg-slate-600'}"></span>
                <span class="font-bold text-xs text-slate-300">${day.format('dddd')}</span>
                <span class="text-[11px] text-slate-500 font-mono">${day.format('DD MMMM')}</span>
                ${isToday ? '<span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-bold">امروز</span>' : ''}
              </div>

              <div class="flex items-center gap-3">
                <span class="text-[11px] text-slate-500 hidden sm:inline">نوبتی ثبت نشده</span>
                <button onclick="openModal('${formattedDate}')" class="px-2.5 py-1 bg-white/5 hover:bg-white/15 text-slate-300 text-[11px] font-bold rounded-xl border border-white/10 transition flex items-center gap-1">
                  <i data-lucide="plus" class="w-3 h-3"></i> رزرو نوبت
                </button>
              </div>
            </div>
          `;
        }

        container.append(rowHtml);
      });

      lucide.createIcons();
    }
  </script>
</body>
</html>
