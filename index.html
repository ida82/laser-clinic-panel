<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت نوبت‌دهی کلینیک</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- کتابخانه اختصاصی Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- تقویم و کتابخانه‌های مورد نیاز -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"/>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

  <style>
    body { font-family: 'Vazirmatn', sans-serif; font-size: 13px; }
    .panel-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05); }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* استایل چک‌باکس‌های تیک‌خوردنی */
    .service-chip input[type="checkbox"] { display: none; }
    .service-chip input[type="checkbox"]:checked + label {
      background-color: #4f46e5;
      color: #ffffff;
      border-color: #4338ca;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen p-3 md:p-5">

  <div class="max-w-[1400px] mx-auto space-y-4">

    <!-- هدر -->
    <header class="panel-card rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 border-r-4 border-r-indigo-600">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
          <i data-lucide="calendar-range" class="w-4 h-4"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">پنل مدیریت نوبت‌دهی کلینیک لیزر</h1>
          <p class="text-[11px] text-slate-400" id="syncStatus">در حال برقراری ارتباط با دیتابیس...</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <button onclick="exportToStyledExcel()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium rounded-lg flex items-center gap-1.5 transition">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 text-emerald-400"></i>
          خروجی اکسل آفلاین
        </button>

        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg text-slate-700 border border-slate-200/60">
          <span id="liveDate" class="text-xs font-semibold">--</span>
          <span class="text-slate-300">|</span>
          <span id="liveClock" class="text-xs font-mono font-bold text-indigo-600">--</span>
        </div>
      </div>
    </header>

    <!-- بخش اصلی -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">

      <!-- ستون فرم ثبت نوبت -->
      <div class="lg:col-span-4">
        <div class="panel-card rounded-xl p-4 sticky top-4">
          <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-slate-100">
            <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
              <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i>
              ثبت نوبت جدید
            </span>
            <span class="text-[10px] text-rose-500 font-medium">* الزامی</span>
          </div>

          <form id="appointmentForm" class="space-y-3">
            
            <div>
              <label class="block text-[11px] font-semibold text-slate-600 mb-1">
                نام و نام خانوادگی <span class="text-rose-500">*</span>
              </label>
              <input type="text" id="clientFullName" placeholder="مثلاً: سارا محمدی" list="nameSuggestions" autocomplete="off"
                class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none transition bg-white">
              <datalist id="nameSuggestions"></datalist>
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-slate-600 mb-1">
                شماره تماس <span class="text-rose-500">*</span>
              </label>
              <input type="tel" id="clientPhone" placeholder="09123456789" list="phoneSuggestions" autocomplete="off"
                class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none transition bg-white">
              <datalist id="phoneSuggestions"></datalist>
            </div>

            <!-- خدمات چند انتخابی (چک باکس) -->
            <div>
              <label class="block text-[11px] font-semibold text-slate-600 mb-1.5">
                ناحیه‌های خدمت (امکان انتخاب چندگانه) <span class="text-rose-500">*</span>
              </label>
              <div class="flex flex-wrap gap-1.5 p-2 bg-slate-50 border border-slate-200/80 rounded-lg max-h-36 overflow-y-auto">
                <div class="service-chip"><input type="checkbox" id="srv_full" value="فول بادی"><label for="srv_full" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">فول بادی</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_face" value="صورت"><label for="srv_face" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">صورت</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_lip" value="پشت لب"><label for="srv_lip" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">پشت لب</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_chin" value="چانه"><label for="srv_chin" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">چانه</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_armpit" value="زیر بغل"><label for="srv_armpit" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">زیر بغل</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_fullarm" value="کل دست"><label for="srv_fullarm" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">کل دست</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_forearm" value="ساعد"><label for="srv_forearm" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">ساعد</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_stomach" value="شکم"><label for="srv_stomach" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">شکم</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_navel" value="خط ناف"><label for="srv_navel" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">خط ناف</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_bikini" value="بیکینی"><label for="srv_bikini" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">بیکینی</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_buttline" value="خط باسن"><label for="srv_buttline" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">خط باسن</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_butt" value="باسن"><label for="srv_butt" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">باسن</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_back" value="کمر"><label for="srv_back" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">کمر</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_thigh" value="ران"><label for="srv_thigh" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">ران</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_fullleg" value="کل پا"><label for="srv_fullleg" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">کل پا</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_shin" value="ساق"><label for="srv_shin" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">ساق</label></div>
                <div class="service-chip"><input type="checkbox" id="srv_co2" value="CO2"><label for="srv_co2" class="px-2 py-1 bg-white border border-slate-200 rounded text-[11px] cursor-pointer inline-block hover:border-indigo-300 transition">CO2</label></div>
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-slate-600 mb-1">
                تاریخ نوبت (شمسی) <span class="text-rose-500">*</span>
              </label>
              <input type="text" id="appointmentDate" placeholder="۱۴۰۵/۰۶/۰۸" autocomplete="off" readonly
                class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none transition bg-white cursor-pointer">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">
                  ساعت حضور <span class="text-rose-500">*</span>
                </label>
                <div dir="ltr" class="flex items-center justify-between bg-white border border-slate-200 rounded-lg px-2 py-1 focus-within:ring-1 focus-within:ring-indigo-500">
                  <input type="number" id="inputHour" min="0" max="23" placeholder="00"
                    class="w-10 text-center text-xs font-bold text-slate-800 outline-none">
                  <span class="text-slate-300 font-bold">:</span>
                  <input type="number" id="inputMin" min="0" max="59" placeholder="00"
                    class="w-10 text-center text-xs font-bold text-slate-800 outline-none">
                </div>
              </div>

              <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">مدت زمان</label>
                <select id="duration" class="w-full px-2 py-1.5 rounded-lg border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none bg-white">
                  <option value="20">۲۰ دقیقه</option>
                  <option value="30">۳۰ دقیقه</option>
                  <option value="45">۴۵ دقیقه</option>
                  <option value="60" selected>۱ ساعت</option>
                  <option value="90">۱.۵ ساعت</option>
                  <option value="120">۲ ساعت</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-slate-600 mb-1">مبلغ خدمت (تومان)</label>
              <input type="number" id="servicePrice" placeholder="مثلاً: 650000"
                class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none transition">
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-slate-600 mb-1">توضیحات</label>
              <input type="text" id="appointmentNotes" placeholder="نکات اختیاری..."
                class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none transition">
            </div>

            <div id="validationAlert" class="hidden p-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-[11px] flex items-center gap-1.5">
              <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i>
              <span id="validationMessage">خطا</span>
            </div>

            <button type="submit" id="submitBtn" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5 shadow-xs">
              <i data-lucide="check" class="w-3.5 h-3.5"></i>
              ثبت و ذخیره نوبت
            </button>
          </form>
        </div>
      </div>

      <!-- ستون تقویم هفتگی -->
      <div class="lg:col-span-8">
        <div class="panel-card rounded-xl p-4 space-y-3">
          
          <div class="flex flex-wrap items-center justify-between gap-2 pb-2.5 border-b border-slate-100">
            <div class="flex items-center gap-1.5">
              <button id="prevWeekBtn" class="p-1 rounded-md border border-slate-200 hover:bg-slate-50 transition text-slate-600" title="هفته قبل">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
              <button id="todayBtn" class="px-2.5 py-1 rounded-md border border-slate-200 text-[11px] font-medium hover:bg-slate-50 transition text-slate-700">
                امروز
              </button>
              <button id="nextWeekBtn" class="p-1 rounded-md border border-slate-200 hover:bg-slate-50 transition text-slate-600" title="هفته بعد">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>

              <input type="text" id="jumpDatePicker" placeholder="📅 پرش به تاریخ..." autocomplete="off" readonly
                class="px-2 py-1 rounded-md border border-slate-200 bg-slate-50 text-slate-600 text-[11px] cursor-pointer hover:bg-slate-100 transition outline-none w-28 text-center">
            </div>
            
            <div id="weekRangeDisplay" class="text-xs font-bold text-slate-800">--</div>
          </div>

          <div id="weekCalendarContainer" class="flex flex-col gap-2.5"></div>

        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rtCxtskzyeiwiprbgfwn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Ox7zpdNlA2Endq7QeiyrSw_kTs67BMB';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let appointments = [];
    let clients = {};
    let currentWeekOffset = 0;

    function toEnDigits(str) {
      if (!str) return '';
      return str.toString()
        .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    $(document).ready(function() {
      lucide.createIcons();

      $("#appointmentDate").pDatepicker({
        format: 'YYYY/MM/DD',
        autoClose: true,
        initialValue: true,
        initialValueType: 'persian'
      });

      $("#jumpDatePicker").pDatepicker({
        format: 'YYYY/MM/DD',
        autoClose: true,
        initialValue: false,
        onSelect: function(unix) {
          const selected = new persianDate(unix);
          const today = new persianDate();
          const todaySat = new persianDate().subtract('days', today.day() - 1);
          const selSat = new persianDate(unix).subtract('days', selected.day() - 1);
          const diffTime = selSat.valueOf() - todaySat.valueOf();
          currentWeekOffset = Math.round(diffTime / (1000 * 60 * 60 * 24 * 7));
          renderWeekCalendar();
        }
      });

      const now = new Date();
      $('#inputHour').val(now.getHours() < 10 ? '0' + now.getHours() : now.getHours());
      $('#inputMin').val('00');

      initLiveDateTime();
      setupEventListeners();
      fetchFromDatabase();
    });

    async function fetchFromDatabase() {
      $('#syncStatus').text('🔄 در حال همگام‌سازی با دیتابیس ابری...');
      try {
        const { data, error } = await supabaseClient
          .from('appointments')
          .select('*')
          .order('time', { ascending: true });

        if (error) throw error;

        appointments = (data || []).map(row => ({
          id: row.id,
          clientName: row.client_name,
          phone: row.phone,
          service: row.service,
          date: row.date,
          time: row.time,
          duration: row.duration,
          price: row.price,
          status: row.status,
          notes: row.notes
        }));

        // پر کردن لیست مشتریان برای autocomplete از کل دیتابیس
        clients = {};
        appointments.forEach(a => {
          if (a.phone && a.clientName) {
            clients[a.phone.trim()] = a.clientName.trim();
          }
        });

        setupAutocomplete();
        renderWeekCalendar();
        $('#syncStatus').text('🟢 متصل به دیتابیس امن Supabase');
      } catch (err) {
        $('#syncStatus').text('❌ خطا در بارگذاری داده‌ها');
        console.error('Supabase Error:', err);
      }
    }

    function initLiveDateTime() {
      function tick() {
        const pDate = new persianDate();
        $('#liveDate').text(pDate.format('dddd DD MMMM YYYY'));
        $('#liveClock').text(pDate.format('HH:mm:ss'));
      }
      tick();
      setInterval(tick, 1000);
    }

    function setupEventListeners() {
      $('#appointmentForm').on('submit', handleFormSubmit);
      $('#prevWeekBtn').on('click', () => { currentWeekOffset--; renderWeekCalendar(); });
      $('#nextWeekBtn').on('click', () => { currentWeekOffset++; renderWeekCalendar(); });
      $('#todayBtn').on('click', () => { currentWeekOffset = 0; renderWeekCalendar(); });

      $('#inputHour').on('input', function() {
        let val = $(this).val();
        if (val.length >= 2 || parseInt(val) > 2) {
          $('#inputMin').focus().select();
        }
      });

      // اتصال خودکار دوطرفه نام و شماره تلفن از دیتابیس
      $('#clientFullName').on('input change', function() {
        const name = $(this).val().trim();
        const foundPhone = Object.keys(clients).find(phone => clients[phone] === name);
        if (foundPhone) {
          $('#clientPhone').val(foundPhone);
        }
      });

      $('#clientPhone').on('input change', function() {
        const phone = $(this).val().trim();
        if (clients[phone]) {
          $('#clientFullName').val(clients[phone]);
        }
      });
    }

    function setupAutocomplete() {
      const phoneList = $('#phoneSuggestions');
      const nameList = $('#nameSuggestions');
      phoneList.empty();
      nameList.empty();

      Object.keys(clients).forEach(phone => {
        phoneList.append(`<option value="${phone}">${clients[phone]}</option>`);
        nameList.append(`<option value="${clients[phone]}">${phone}</option>`);
      });
    }

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function checkConflict(dateStr, startTime, duration) {
      const newStart = timeToMinutes(startTime);
      const newEnd = newStart + parseInt(duration);

      return appointments.some(app => {
        if (app.status === 'cancelled') return false;
        if (toEnDigits(app.date) !== toEnDigits(dateStr)) return false;

        const existStart = timeToMinutes(app.time);
        const existEnd = existStart + parseInt(app.duration);

        return Math.max(newStart, existStart) < Math.min(newEnd, existEnd);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const phone = $('#clientPhone').val().trim();
      const fullName = $('#clientFullName').val().trim();
      
      // دریافت تمام گزینه‌های تیک‌خورده
      const selectedServices = [];
      $('.service-chip input[type="checkbox"]:checked').each(function() {
        selectedServices.push($(this).val());
      });
      const service = selectedServices.join('، ');

      const rawDate = $('#appointmentDate').val();
      const date = toEnDigits(rawDate);
      const hourVal = $('#inputHour').val().trim();
      const minVal = $('#inputMin').val().trim();
      const duration = parseInt($('#duration').val());
      const price = parseInt($('#servicePrice').val()) || 0;
      const notes = $('#appointmentNotes').val().trim();

      if (!fullName || !phone || selectedServices.length === 0 || !date || hourVal === '' || minVal === '') {
        $('#validationMessage').text('لطفاً تمامی فیلدهای ستاره‌دار و حداقل یک ناحیه خدمت را انتخاب کنید.');
        $('#validationAlert').removeClass('hidden');
        return;
      }

      const h = parseInt(hourVal);
      const m = parseInt(minVal);
      const time = `${h < 10 ? '0' + h : h}:${m < 10 ? '0' + m : m}`;

      if (checkConflict(date, time, duration)) {
        $('#validationMessage').text(`تداخل نوبت! در تاریخ ${date} از ساعت ${time} بازه زمانی انتخابی پر است.`);
        $('#validationAlert').removeClass('hidden');
        return;
      }
      $('#validationAlert').addClass('hidden');

      const newAppointment = {
        id: 'app_' + Date.now(),
        client_name: fullName,
        phone: phone,
        service: service,
        date: date,
        time: time,
        duration: duration,
        price: price,
        status: 'pending',
        notes: notes
      };

      $('#syncStatus').text('🔄 در حال ذخیره در دیتابیس...');
      
      const { error } = await supabaseClient
        .from('appointments')
        .insert([newAppointment]);

      if (error) {
        alert('خطا در ذخیره دیتابیس: ' + error.message);
        $('#syncStatus').text('❌ خطا در ذخیره');
        return;
      }

      $('#appointmentForm')[0].reset();
      $('.service-chip input[type="checkbox"]').prop('checked', false);
      $('#appointmentDate').pDatepicker('setDate', new persianDate().valueOf());
      $('#inputHour').val(h < 10 ? '0' + h : h);
      $('#inputMin').val('00');

      fetchFromDatabase();
    }

    window.changeStatus = async function(id, newStatus) {
      const { error } = await supabaseClient
        .from('appointments')
        .update({ status: newStatus })
        .eq('id', id);

      if (!error) {
        fetchFromDatabase();
      }
    };

    window.deleteAppointment = async function(id) {
      if (confirm('آیا این نوبت برای همیشه حذف شود؟')) {
        const { error } = await supabaseClient
          .from('appointments')
          .delete()
          .eq('id', id);

        if (!error) {
          fetchFromDatabase();
        }
      }
    };

    window.toggleDetails = function(id) {
      $(`#details_${id}`).toggleClass('hidden');
    };

    window.exportToStyledExcel = function() {
      if (appointments.length === 0) {
        alert('هیچ نوبتی ثبت نشده است.');
        return;
      }

      const wb = XLSX.utils.book_new();

      const clientData = [["ردیف", "نام و نام خانوادگی", "شماره تماس"]];
      let cIndex = 1;
      Object.keys(clients).forEach(phone => {
        clientData.push([cIndex++, clients[phone], phone]);
      });
      const wsClients = XLSX.utils.aoa_to_sheet(clientData);
      wsClients['!cols'] = [{ wch: 8 }, { wch: 25 }, { wch: 18 }];
      XLSX.utils.book_append_sheet(wb, wsClients, "مشتریان");

      const allAppointmentsData = [
        ["ردیف", "نام مراجع", "شماره تماس", "نوع خدمت", "تاریخ", "ساعت", "مدت (دقیقه)", "مبلغ (تومان)", "وضعیت", "توضیحات"]
      ];
      appointments.forEach((a, idx) => {
        let statusLabel = a.status === 'completed' ? 'انجام شد' : a.status === 'cancelled' ? 'لغو شده' : 'در انتظار';
        allAppointmentsData.push([
          idx + 1, a.clientName, a.phone, a.service, a.date, a.time, a.duration, a.price || 0, statusLabel, a.notes || ''
        ]);
      });
      const wsAppointments = XLSX.utils.aoa_to_sheet(allAppointmentsData);
      wsAppointments['!cols'] = [{ wch: 6 }, { wch: 22 }, { wch: 16 }, { wch: 26 }, { wch: 14 }, { wch: 10 }, { wch: 12 }, { wch: 16 }, { wch: 14 }, { wch: 30 }];
      XLSX.utils.book_append_sheet(wb, wsAppointments, "همه نوبت‌ها");

      const accountingData = [
        ["ردیف", "نام مراجع", "شماره تماس", "خدمت انجام‌شده", "تاریخ نوبت", "ساعت", "مبلغ دریافتی (تومان)"]
      ];
      let totalRevenue = 0;
      let accIndex = 1;
      appointments.filter(a => a.status === 'completed').forEach(a => {
        const val = a.price || 0;
        totalRevenue += val;
        accountingData.push([accIndex++, a.clientName, a.phone, a.service, a.date, a.time, val]);
      });
      accountingData.push(["", "", "", "", "", "جمع کل دریافتی:", totalRevenue]);

      const wsAccounting = XLSX.utils.aoa_to_sheet(accountingData);
      wsAccounting['!cols'] = [{ wch: 6 }, { wch: 22 }, { wch: 16 }, { wch: 28 }, { wch: 14 }, { wch: 10 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, wsAccounting, "داشبورد حسابداری");

      XLSX.writeFile(wb, `گزارش_کلینیک_${new persianDate().format('YYYY-MM-DD')}.xlsx`);
    };

    function renderWeekCalendar() {
      const container = $('#weekCalendarContainer');
      container.empty();

      let baseDate = new persianDate().add('days', currentWeekOffset * 7);
      let dayOfWeek = baseDate.day();
      let startOfWeek = baseDate.subtract('days', dayOfWeek - 1);

      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        weekDays.push(new persianDate(startOfWeek.valueOf()).add('days', i));
      }

      $('#weekRangeDisplay').text(`${weekDays[0].format('DD MMMM')} الی ${weekDays[6].format('DD MMMM YYYY')}`);
      const todayStr = toEnDigits(new persianDate().format('YYYY/MM/DD'));

      weekDays.forEach(day => {
        const formattedDate = toEnDigits(day.format('YYYY/MM/DD'));
        const isToday = formattedDate === todayStr;

        const dayAppointments = appointments
          .filter(a => toEnDigits(a.date) === formattedDate)
          .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

        let cardsHtml = '';
        dayAppointments.forEach(app => {
          let statusStyle = 'bg-amber-50/90 border-amber-200 text-amber-900';
          let badgeText = 'در انتظار';
          let badgeClass = 'bg-amber-100 text-amber-800 border-amber-300';

          if (app.status === 'completed') {
            statusStyle = 'bg-emerald-50/90 border-emerald-200 text-emerald-900';
            badgeText = 'انجام شد';
            badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300 font-medium';
          } else if (app.status === 'cancelled') {
            statusStyle = 'bg-rose-50/90 border-rose-200 text-rose-950 border-2';
            badgeText = 'لغو شد';
            badgeClass = 'bg-rose-100 text-rose-800 border-rose-300 font-bold';
          }

          cardsHtml += `
            <div class="flex flex-col rounded-lg border ${statusStyle} shadow-xs text-xs overflow-hidden transition">
              <div class="flex flex-wrap items-center justify-between gap-2 px-3 py-1.5 bg-white/70">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="font-mono font-bold text-slate-800 bg-white px-2 py-0.5 rounded border border-slate-200 shadow-xs">${app.time}</span>
                  <span class="font-bold text-slate-900">${app.clientName}</span>
                  <span class="text-[11px] text-slate-500 font-mono">(${app.phone})</span>
                  <span class="text-[10px] px-2 py-0.5 rounded border ${badgeClass}">${badgeText}</span>
                  
                  <button onclick="toggleDetails('${app.id}')" class="px-2 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded text-[11px] font-semibold transition">
                    🔍 جزئیات
                  </button>
                </div>

                <div class="flex items-center gap-1">
                  <button onclick="changeStatus('${app.id}', 'pending')" title="در انتظار" class="px-2 py-0.5 bg-white hover:bg-amber-100 border border-amber-200 rounded text-[11px] text-amber-800 transition">⏳ انتظار</button>
                  <button onclick="changeStatus('${app.id}', 'completed')" title="انجام شد" class="px-2 py-0.5 bg-white hover:bg-emerald-100 border border-emerald-200 rounded text-[11px] text-emerald-800 transition">✔️ انجام</button>
                  <button onclick="changeStatus('${app.id}', 'cancelled')" title="لغو نوبت" class="px-2 py-0.5 bg-white hover:bg-rose-100 border border-rose-200 rounded text-[11px] text-rose-800 transition">✖️ لغو</button>
                  <button onclick="deleteAppointment('${app.id}')" title="حذف نوبت" class="p-1 text-rose-600 hover:bg-rose-100 rounded transition mr-0.5">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>

              <div id="details_${app.id}" class="hidden px-3 py-2 bg-slate-50/90 border-t border-slate-200/80 flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-slate-700">
                <div><span class="font-semibold text-slate-500">ناحیه خدمت:</span> <span class="font-bold text-indigo-700">${app.service}</span></div>
                <div><span class="font-semibold text-slate-500">مدت زمان:</span> <span class="font-medium text-slate-800">${app.duration} دقیقه</span></div>
                <div><span class="font-semibold text-slate-500">مبلغ خدمت:</span> <span class="font-bold text-emerald-700">${app.price ? Number(app.price).toLocaleString() + ' تومان' : 'ثبت نشده'}</span></div>
                ${app.notes ? `<div class="w-full text-slate-600 italic bg-white p-1 rounded border border-slate-200 mt-0.5">نکات: ${app.notes}</div>` : ''}
              </div>
            </div>
          `;
        });

        const rowHtml = `
          <div class="flex flex-col md:flex-row items-stretch gap-2 p-2.5 rounded-xl border ${isToday ? 'border-indigo-400 bg-indigo-50/20 ring-1 ring-indigo-300' : 'border-slate-200/80 bg-white'} shadow-xs">
            <div class="flex md:flex-col items-center justify-between md:justify-center p-2 rounded-lg ${isToday ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'} md:w-32 shrink-0 text-center">
              <span class="font-bold text-xs">${day.format('dddd')}</span>
              <span class="text-[10px] opacity-85">${day.format('DD MMMM')}</span>
              
              <span class="text-[10px] mt-1 px-2 py-0.5 rounded-full font-bold ${isToday ? 'bg-indigo-700 text-indigo-100' : (dayAppointments.length > 0 ? 'bg-indigo-100 text-indigo-700' : 'bg-white text-slate-400 border border-slate-200')}">
                ${dayAppointments.length} نوبت
              </span>
            </div>

            <div class="flex-1 flex flex-col gap-1.5 justify-center">
              ${cardsHtml || '<div class="text-[11px] text-slate-400 py-1 px-2">هیچ نوبتی برای این روز ثبت نشده است.</div>'}
            </div>
          </div>
        `;

        container.append(rowHtml);
      });

      lucide.createIcons();
    }
  </script>
</body>
</html>
